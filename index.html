
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ملتقى أولياء الأمور | مدرسة أبو الدرداء للبنين (5-12)</title>

  <meta name="theme-color" content="#102b4e">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f3f6fa;
      color: #173454;
    }

    .header {
      background: linear-gradient(135deg, #102b4e, #245780);
      color: white;
      text-align: center;
      padding: 22px 15px;
      border-bottom: 4px solid #d5ad52;
    }

    .logo {
      width: 85px;
      height: 85px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    .school {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .meeting {
      font-size: 17px;
      color: #f4d68b;
    }

    .subtitle {
      margin-top: 9px;
      font-size: 13px;
      color: #e1e9f2;
    }

    .main {
      max-width: 1100px;
      margin: 18px auto;
      padding: 0 12px;
    }

    .frame-container {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(0,0,0,.10);
      border: 1px solid #e0e6ed;
    }

    iframe {
      display: block;
      width: 100%;
      height: 1100px;
      border: 0;
      background: white;
    }

    .actions {
      text-align: center;
      padding: 18px;
    }

    .btn {
      display: inline-block;
      background: #173f69;
      color: white;
      text-decoration: none;
      padding: 13px 25px;
      border-radius: 10px;
      font-weight: bold;
    }

    .btn:hover {
      background: #28618f;
    }

    .footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #66788a;
    }

    @media (max-width: 600px) {
      .school {
        font-size: 17px;
      }

      .meeting {
        font-size: 15px;
      }

      .logo {
        width: 70px;
        height: 70px;
      }

      iframe {
        height: 1250px;
      }

      .main {
        margin: 10px auto;
        padding: 0 6px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <img
      class="logo"
      src="https://e.top4top.io/p_3957upn9k1.png"
      alt="شعار مدرسة أبو الدرداء">

    <div class="school">
      مدرسة أبو الدرداء للبنين (5-12)
    </div>

    <div class="meeting">
      الملتقى التربوي الأول لأولياء الأمور والهيئة التعليمية
    </div>

    <div class="subtitle">
      منظومة تسجيل الحضور ومتابعة التحصيل الدراسي
    </div>
  </header>

  <main class="main">

    <div class="frame-container">
      <iframe
        id="attendanceFrame"
        title="تسجيل حضور أولياء الأمور"
        src="https://script.google.com/macros/s/AKfycby_IYpodFHXkVA8pTV74_uKgz5sx51tlIsovumjKEJkAlozwAH2VIWAYDzo8ATEWdAIbw/exec"
        loading="eager"
        allowfullscreen>
      </iframe>
    </div>

    <div class="actions">
      <a
        class="btn"
        href="https://script.google.com/macros/s/AKfycby_IYpodFHXkVA8pTV74_uKgz5sx51tlIsovumjKEJkAlozwAH2VIWAYDzo8ATEWdAIbw/exec"
        target="_blank"
        rel="noopener noreferrer">
        فتح منظومة التسجيل مباشرة
      </a>
    </div>

  </main>

  <footer class="footer">
    مدرسة أبو الدرداء للبنين (5-12)
    — محافظة الظاهرة
  </footer>

</body>
</html>
